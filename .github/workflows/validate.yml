name: validate-skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install skills-ref (pinned)
        # Pinned to upstream commit 69ef37e (2026-08-31) — update deliberately,
        # verify locally first. Do NOT use a moving tag/branch here.
        run: |
          git clone https://github.com/agentskills/agentskills.git /tmp/agentskills
          git -C /tmp/agentskills checkout 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/agentskills/skills-ref

      - name: Validate SKILL.md
        run: skills-ref validate "$PWD"

      - name: Run skill regression checks (evals/validate.py)
        run: python evals/validate.py

      - name: Run executable behavior evals
        run: python evals/run_behavior.py

      - name: Run version lint
        run: python scripts/version-lint.py

      - name: Run shared-fragment consistency lint
        run: python scripts/fragment-lint.py
