name: validate-skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners' Python stdout defaults to legacy codepages (cp1252);
      # the lints print Chinese (verdict-ban list) — force UTF-8 on all OSes.
      PYTHONUTF8: 1
    strategy:
      fail-fast: false
      matrix:
        # Windows 覆盖：lint/eval 脚本为纯 stdlib，三平台均可跑；
        # skills-ref CLI 在 Windows 上有上游问题（静默 exit 1，无输出），
        # 相关两步用 runner.os 门控跳过，规范验证由 ubuntu/macos 承担。
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        # Pinned to the v4 tag commit (tag is mutable; SHA is not)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install skills-ref (pinned, non-Windows only)
        if: runner.os != 'Windows'
        # Pinned to upstream commit 69ef37e (2026-08-31) — update deliberately,
        # verify locally first. Do NOT use a moving tag/branch here.
        run: |
          git clone https://github.com/agentskills/agentskills.git /tmp/agentskills
          git -C /tmp/agentskills checkout 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/agentskills/skills-ref

      - name: Validate SKILL.md (non-Windows only)
        if: runner.os != 'Windows'
        run: skills-ref validate "$PWD"

      - name: Run skill regression checks (evals/validate.py)
        run: python evals/validate.py

      - name: Run executable behavior evals
        run: python evals/run_behavior.py

      - name: Run version lint
        run: python scripts/version-lint.py

      - name: Run shared-fragment consistency lint
        run: python scripts/fragment-lint.py
