name: publish-tessl

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    # 仅当配置了 TESSL_TOKEN（Tessl API key）才运行；未配置时静默跳过，不影响主 CI
    if: secrets.TESSL_TOKEN != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Review skill quality
        run: tessl skill review ./SKILL.md
      - name: Publish to Tessl registry
        run: tessl plugin publish
